<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crocodora Creative Studio — Works</title>
<link rel="icon" href="https://i.postimg.cc/L4w8Y133/Asset-114x.png">
<style>
/* ============================================
   CROCODORA CREATIVE STUDIO — shared stylesheet
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg: #08080a;
  --bg-soft: #0f0f12;
  --ink: #f4f4f6;
  --ink-dim: #9a9aa4;
  --line: rgba(255,255,255,.09);

  --glass-bg: rgba(255,255,255,.06);
  --glass-bg-strong: rgba(255,255,255,.12);
  --glass-border: rgba(255,255,255,.28);
  --glass-highlight: rgba(255,255,255,.55);

  --chrome-1: #e9eaee;
  --chrome-2: #9a9ca4;
  --chrome-3: #4a4c52;

  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 8px;

  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
img{ max-width: 100%; display:block; }
a{ color: inherit; text-decoration: none; }

::selection{ background: var(--chrome-1); color:#000; }

.container{
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 6vw;
}

/* ---------------------------------
   Liquid-glass navigation
--------------------------------- */
.site-header{
  position: fixed;
  top: 22px;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6vw;
  pointer-events: none;
}

.logo{
  pointer-events: all;
  display: flex;
  align-items: center;
}
.logo img{
  height: 34px;
  width: auto;
}

.glass-nav{
  pointer-events: all;
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px;
  border-radius: 999px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 8px rgba(255,255,255,.06),
    0 10px 30px rgba(0,0,0,.35);
  overflow: hidden;
}
.glass-nav::before{
  /* subtle roaming light sweep, like liquid glass specular highlight */
  content:"";
  position: absolute;
  top: -50%;
  left: -20%;
  width: 60%;
  height: 200%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.18) 45%, transparent 60%);
  transform: rotate(8deg);
  animation: glassSweep 7s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glassSweep{
  0%   { left: -40%; }
  50%  { left: 110%; }
  100% { left: 110%; }
}

.glass-nav a{
  position: relative;
  z-index: 1;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-dim);
  padding: 10px 20px;
  border-radius: 999px;
  transition: color .25s ease, background .25s ease;
  white-space: nowrap;
}
.glass-nav a:hover{
  color: var(--ink);
}
.glass-nav a.active{
  color: #0a0a0c;
  background: var(--ink);
}

.nav-toggle{
  display:none;
}

@media (max-width: 720px){
  .site-header{ top: 16px; padding: 0 5vw; }
  .logo img{ height: 26px; }
  .glass-nav a{ padding: 9px 13px; font-size: 12.5px; }
}

/* ---------------------------------
   Hero — 8 column marquee
--------------------------------- */
.hero{
  position: relative;
  height: 100vh;
  min-height: 640px;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
}

.marquee-wrap{
  position: absolute;
  inset: -8% -6%;
  display: flex;
  gap: 3px;
  transform: rotate(-3.5deg) scale(1.08);
}

.marquee-col{
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  will-change: transform;
}
.marquee-col img{
  width: 100%;
  height: 260px;
  object-fit: cover;
  filter: saturate(.85) brightness(.72);
  flex: 0 0 auto;
}

@keyframes scrollUp{
  from{ transform: translateY(0); }
  to{ transform: translateY(-50%); }
}
@keyframes scrollDown{
  from{ transform: translateY(-50%); }
  to{ transform: translateY(0); }
}
.marquee-col.up   { animation: scrollUp linear infinite; }
.marquee-col.down { animation: scrollDown linear infinite; }

.hero-overlay{
  position: absolute;
  inset: 0;
  background:
    linear-gradient(0deg, rgba(8,8,10,.92) 0%, rgba(8,8,10,.55) 38%, rgba(8,8,10,.72) 100%);
  z-index: 2;
}

.hero-content{
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 6vw 9vh;
}

.hero-eyebrow{
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-dim);
  margin-bottom: 20px;
  letter-spacing: .2px;
}

.hero-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(40px, 6.4vw, 92px);
  line-height: .98;
  margin: 0 0 34px;
  max-width: 16ch;
  color: var(--ink);
}

.hero-tagline{
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink-dim);
  margin-bottom: 30px;
}

.hero-cta{
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.btn{
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  padding: 15px 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease, opacity .2s ease;
}
.btn:hover{ transform: translateY(-2px); }
.btn-primary{
  background: var(--ink);
  color: #0a0a0c;
}
.btn-primary:hover{ opacity: .88; }
.btn-ghost{
  background: rgba(255,255,255,.08);
  color: var(--ink);
  border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(10px);
}
.btn-ghost:hover{ background: rgba(255,255,255,.14); }

.scroll-hint{
  position: absolute;
  right: 6vw;
  bottom: 4vh;
  z-index: 3;
  font-size: 12px;
  color: var(--ink-dim);
  letter-spacing: .3px;
}

@media (max-width: 720px){
  .marquee-col img{ height: 170px; }
  .hero-content{ padding: 0 6vw 12vh; }
  .scroll-hint{ display:none; }
}

/* ---------------------------------
   Generic page sections
--------------------------------- */
.page-hero{
  padding: 190px 0 70px;
  border-bottom: 1px solid var(--line);
}
.page-hero .eyebrow{
  font-size: 13px;
  color: var(--ink-dim);
  font-weight: 600;
  margin-bottom: 16px;
}
.page-hero h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 5vw, 60px);
  line-height: 1.03;
  margin: 0 0 20px;
  max-width: 18ch;
}
.page-hero p{
  font-size: 16px;
  color: var(--ink-dim);
  max-width: 56ch;
  line-height: 1.6;
}

section{ padding: 90px 0; }
section.tight{ padding: 60px 0; }

.section-head{
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 30px;
  margin-bottom: 46px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 26px;
}
.section-head h2{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, 3vw, 34px);
  margin: 0;
}
.section-head span{
  color: var(--ink-dim);
  font-size: 14px;
  max-width: 40ch;
}

/* services grid */
.services-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.service-card{
  background: var(--bg-soft);
  padding: 40px 34px;
}
.service-card .num{
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 40px;
  display: block;
}
.service-card h3{
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  margin: 0 0 12px;
}
.service-card p{
  font-size: 14.5px;
  color: var(--ink-dim);
  line-height: 1.6;
  margin: 0;
}

@media (max-width: 900px){
  .services-grid{ grid-template-columns: 1fr; }
}

/* work / portfolio grid */
.work-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}
.work-card{
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  aspect-ratio: 4 / 3;
  background: var(--bg-soft);
}
.work-card img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
}
.work-card:hover img{ transform: scale(1.05); }
.work-card .tag{
  position: absolute;
  left: 16px;
  bottom: 16px;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(8,8,10,.55);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.18);
}

@media (max-width: 720px){
  .work-grid{ grid-template-columns: 1fr; }
}

/* contact */
.contact-grid{
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 60px;
}
.contact-info h3{
  font-family: var(--font-display);
  font-size: 18px;
  margin: 0 0 10px;
}
.contact-info p{
  color: var(--ink-dim);
  font-size: 14.5px;
  line-height: 1.7;
  margin: 0 0 30px;
}
.contact-list{ list-style:none; padding:0; margin:0; }
.contact-list li{
  padding: 16px 0;
  border-top: 1px solid var(--line);
  display:flex;
  justify-content: space-between;
  font-size: 14.5px;
}
.contact-list li:last-child{ border-bottom: 1px solid var(--line); }
.contact-list span{ color: var(--ink-dim); }

.field{
  margin-bottom: 18px;
}
.field label{
  display:block;
  font-size: 12.5px;
  color: var(--ink-dim);
  margin-bottom: 8px;
}
.field input,
.field textarea{
  width: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px 15px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  resize: vertical;
}
.field input:focus,
.field textarea:focus{
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

@media (max-width: 800px){
  .contact-grid{ grid-template-columns: 1fr; }
}

/* footer */
footer{
  border-top: 1px solid var(--line);
  padding: 40px 0;
}
.footer-row{
  display:flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.footer-row .logo img{ height: 24px; }
.footer-links{
  display:flex;
  gap: 26px;
}
.footer-links a{
  font-size: 13px;
  color: var(--ink-dim);
}
.footer-links a:hover{ color: var(--ink); }
.footer-note{
  font-size: 12.5px;
  color: var(--ink-dim);
}

@media (prefers-reduced-motion: reduce){
  .marquee-col, .glass-nav::before{ animation: none !important; }
}

</style>
</head>
<body data-page="works">

<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="container">

    <h1>A selection of recent projects.</h1>
    <p>Branding, campaign art and gaming identity work for clients and communities across the region.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="work-grid">
      <div class="work-card">
        <img src="https://i.postimg.cc/FFT9tnKW/banner.png" alt="Campaign banner">
        <span class="tag">Campaign</span>
      </div>
      <div class="work-card">
        <img src="https://i.postimg.cc/MTd8SvzT/1.png" alt="Brand project">
        <span class="tag">Branding</span>
      </div>
      <div class="work-card">
        <img src="https://i.postimg.cc/T11vYfPz/18.png" alt="Project">
        <span class="tag">Art Direction</span>
      </div>
      <div class="work-card">
        <img src="https://i.postimg.cc/Bv50mmk3/banner12.png" alt="Campaign banner">
        <span class="tag">Campaign</span>
      </div>
      <div class="work-card">
        <img src="https://i.postimg.cc/G3g1g87p/banner23.png" alt="Campaign banner">
        <span class="tag">Campaign</span>
      </div>
      <div class="work-card">
        <img src="https://i.postimg.cc/bvfP0769/Chat-GPT-Image-Sep-4-2026-at-12-17-01-PM.png" alt="Project artwork">

<section class="tight">
  <div class="container">

      <h2>Like what you see?</h2>

    </div>

  </div>
</section>

<footer id="site-footer"></footer>

<script>
/* ============================================
   CROCODORA CREATIVE STUDIO — shared behaviour
   ============================================ */

const SITE_LOGO = "https://i.postimg.cc/L4w8Y133/Asset-114x.png";

const WORK_IMAGES = [
  "https://i.postimg.cc/FFT9tnKW/banner.png",
  "https://i.postimg.cc/MTd8SvzT/1.png",
  "https://i.postimg.cc/T11vYfPz/18.png",
  "https://i.postimg.cc/Bv50mmk3/banner12.png",
  "https://i.postimg.cc/G3g1g87p/banner23.png",
  "https://i.postimg.cc/bvfP0769/Chat-GPT-Image-Sep-4-2026-at-12-17-01-PM.png",
  "https://i.postimg.cc/0Q8qFp17/studio-logo.png",
  "https://i.postimg.cc/QNYrY943/Untitled-1.png"
];

const NAV_LINKS = [
  { label: "Home",     href: "/home",     match: "home" },
  { label: "Services", href: "/services", match: "services" },
  { label: "Works",    href: "/works",    match: "works" },
  { label: "Contact",  href: "/contact",  match: "contact" }
];

function renderHeader(){
  const mount = document.getElementById("site-header");
  if(!mount) return;
  const current = document.body.dataset.page || "home";

  const links = NAV_LINKS.map(l =>
    `<a href="${l.href}" class="${l.match === current ? "active" : ""}">${l.label}</a>`
  ).join("");

  mount.innerHTML = `
    <a href="/home" class="logo"><img src="${SITE_LOGO}" alt="Crocodora Creative Studio"></a>
    <nav class="glass-nav">${links}</nav>
  `;
}

function renderFooter(){
  const mount = document.getElementById("site-footer");
  if(!mount) return;
  mount.innerHTML = `
    <div class="container footer-row">
      <a href="/home" class="logo"><img src="${SITE_LOGO}" alt="Crocodora Creative Studio"></a>
      <div class="footer-links">
        <a href="/home">Home</a>
        <a href="/services">Services</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
      </div>
      <div class="footer-note">&copy; 2026 Crocodora Creative Studio</div>
    </div>
  `;
}

/* 8-column marquee hero — each column carries a single design,
   repeated twice for a seamless loop. Neighbouring columns run at
   different speeds / directions so nothing moves in sync. */
function renderMarquee(){
  const wrap = document.getElementById("marquee-wrap");
  if(!wrap) return;

  const durations = [26, 34, 22, 38, 28, 32, 24, 36];

  WORK_IMAGES.forEach((src, i) => {
    const col = document.createElement("div");
    const dir = i % 2 === 0 ? "up" : "down";
    col.className = `marquee-col ${dir}`;
    col.style.animationDuration = durations[i % durations.length] + "s";

    // duplicate the single image several times so the column always
    // fills the viewport height and the loop has no visible seam
    for(let copy = 0; copy < 8; copy++){
      const img = document.createElement("img");
      img.src = src;
      img.alt = "";
      img.loading = copy < 2 ? "eager" : "lazy";
      col.appendChild(img);
    }
    wrap.appendChild(col);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  renderHeader();
  renderFooter();
  renderMarquee();
});

</script>
</body>
</html>
